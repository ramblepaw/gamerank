<!doctype html>
<html lang="en" data-theme="dusk" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; GameRank</title>
<link rel="icon" href="/static/icon.svg?v={{ asset_v }}" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon.ico?v={{ asset_v }}" sizes="48x48 32x32 16x16">
<link rel="apple-touch-icon" href="/static/icon-180.png?v={{ asset_v }}">
<link rel="manifest" href="/static/site.webmanifest">
<meta name="theme-color" content="#16121a">
<link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
</head>
<body>
<main style="max-width:380px;margin-top:12vh">
  <h1>GameRank</h1>
  <p class="sub">Sign in.</p>

  {% if error %}<div class="flash warn">{{ error }}</div>{% endif %}

  <form method="post" action="/login" class="card grain">
    <label class="lbl" for="username">Username</label>
    <input type="text" name="username" id="username" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>

    <div style="height:14px"></div>
    <label class="lbl" for="password">Password</label>
    <input type="password" name="password" id="password" autocomplete="current-password">

    <div style="height:14px"></div>
    <button class="primary" type="submit" style="width:100%">Sign in</button>
  </form>
</main>
</body>
</html>
